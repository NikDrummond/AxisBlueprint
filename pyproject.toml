[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "axisblueprint"
version = "0.1.0"
description = "Interactive layout designer for multi-panel scientific figures (Tkinter + Matplotlib export)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Nik Drummond", email = "nikolasdrummond@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/NikDrummond/AxisBlueprint"

[project.scripts]
axisblueprint = "AxisBlueprint.main:BlueprintBuilder"

[tool.setuptools.packages.find]
where = ["."]
